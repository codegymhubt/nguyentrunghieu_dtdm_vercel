<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      display:flex;
    }

    .sidebar{
      width:260px;
      background:rgba(15,23,42,0.95);
      border-right:1px solid rgba(255,255,255,0.08);
      padding:30px 20px;
      display:flex;
      flex-direction:column;
      gap:30px;
    }

    .logo{
      font-size:24px;
      font-weight:700;
      letter-spacing:1px;
      color:#38bdf8;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .menu button{
      background:transparent;
      border:none;
      color:#cbd5e1;
      padding:14px;
      border-radius:12px;
      text-align:left;
      cursor:pointer;
      transition:0.3s;
      font-size:15px;
    }

    .menu button:hover,
    .menu button.active{
      background:#1e293b;
      color:white;
    }

    .main{
      flex:1;
      padding:30px;
      overflow:auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .title h1{
      font-size:32px;
      font-weight:700;
    }

    .title p{
      color:#94a3b8;
      margin-top:5px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:22px;
      padding:24px;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .card h3{
      color:#94a3b8;
      font-size:15px;
      margin-bottom:12px;
    }

    .card h2{
      font-size:34px;
    }

    .table-section{
      background:rgba(255,255,255,0.05);
      border-radius:25px;
      padding:25px;
      border:1px solid rgba(255,255,255,0.06);
    }

    .table-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      gap:15px;
      flex-wrap:wrap;
    }

    .search-box{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    input{
      background:#1e293b;
      border:none;
      outline:none;
      color:white;
      padding:12px 15px;
      border-radius:12px;
      min-width:220px;
    }

    button.primary{
      background:#38bdf8;
      color:#0f172a;
      border:none;
      padding:12px 20px;
      border-radius:12px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    button.primary:hover{
      transform:scale(1.03);
    }

    table{
      width:100%;
      border-collapse:collapse;
      overflow:hidden;
    }

    th{
      text-align:left;
      padding:16px;
      color:#94a3b8;
      font-size:14px;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    td{
      padding:18px 16px;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    tr:hover{
      background:rgba(255,255,255,0.03);
    }

    .status{
      padding:7px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
      display:inline-block;
    }

    .active-status{
      background:rgba(34,197,94,0.2);
      color:#4ade80;
    }

    .inactive-status{
      background:rgba(239,68,68,0.2);
      color:#f87171;
    }

    .action-btn{
      border:none;
      padding:9px 14px;
      border-radius:10px;
      cursor:pointer;
      font-size:13px;
      font-weight:600;
      margin-right:8px;
      transition:0.3s;
    }

    .edit{
      background:#0ea5e9;
      color:white;
    }

    .delete{
      background:#ef4444;
      color:white;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .modal-content{
      width:450px;
      background:#111827;
      padding:30px;
      border-radius:25px;
      border:1px solid rgba(255,255,255,0.06);
    }

    .modal-content h2{
      margin-bottom:20px;
    }

    .modal-content form{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .modal-content select{
      background:#1e293b;
      border:none;
      color:white;
      padding:12px;
      border-radius:12px;
    }

    .btn-group{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .cancel{
      flex:1;
      background:#334155;
      color:white;
      border:none;
      border-radius:12px;
      cursor:pointer;
      padding:12px;
    }

    .save{
      flex:1;
      background:#38bdf8;
      color:#0f172a;
      border:none;
      border-radius:12px;
      cursor:pointer;
      padding:12px;
      font-weight:600;
    }

    @media(max-width:900px){
      body{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
        flex-direction:row;
        justify-content:space-between;
        align-items:center;
      }

      .menu{
        flex-direction:row;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">STUDENT SYS</div>

    <div class="menu">
      <button class="active">Dashboard</button>
      <!-- <button>Students</button>
      <button>Classes</button>
      <button>Settings</button> -->
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <div class="title">
        <h1>Student Management</h1>
        <p>Modern Student Dashboard</p>
      </div>

      <button class="primary" onclick="openModal()">
        + Add Student
      </button>
    </div>

    <section class="stats">

      <div class="card">
        <h3>Total Students</h3>
        <h2 id="totalStudents">0</h2>
      </div>

      <div class="card">
        <h3>Active Students</h3>
        <h2 id="activeStudents">0</h2>
      </div>

      <div class="card">
        <h3>Inactive Students</h3>
        <h2 id="inactiveStudents">0</h2>
      </div>

    </section>

    <section class="table-section">

      <div class="table-header">

        <div>
          <h2>Students List</h2>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search student..." onkeyup="searchStudent()">
        </div>

      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Class</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>
      </table>

    </section>

  </main>

  <!-- MODAL -->

  <div class="modal" id="studentModal">

    <div class="modal-content">

      <h2>Add Student</h2>

      <form id="studentForm">

        <input type="text" id="name" placeholder="Full name" required>

        <input type="email" id="email" placeholder="Email" required>

        <input type="text" id="className" placeholder="Class" required>

        <select id="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

        <div class="btn-group">
          <button type="button" class="cancel" onclick="closeModal()">
            Cancel
          </button>

          <button type="submit" class="save">
            Save Student
          </button>
        </div>

      </form>

    </div>

  </div>

  <script>

    // Dữ liệu lưu RAM (mất khi refresh)
    let students = [
      {
        id: 1,
        name: "Nguyen Trung Hieu",
        email: "hieu@gmail.com",
        className: "TH29.17",
        status: "Active"
      },
      {
        id: 2,
        name: "Trung Hieu",
        email: "hieu@gmail.com",
        className: "TH29.17",
        status: "Inactive"
      }
    ];

    let editId = null;

    const table = document.getElementById("studentTable");

    function renderStudents(data = students){

      table.innerHTML = "";

      data.forEach(student => {

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${student.id}</td>
          <td>${student.name}</td>
          <td>${student.email}</td>
          <td>${student.className}</td>

          <td>
            <span class="status ${
              student.status === "Active"
              ? "active-status"
              : "inactive-status"
            }">
              ${student.status}
            </span>
          </td>

          <td>
            <button class="action-btn edit"
              onclick="editStudent(${student.id})">
              Edit
            </button>

            <button class="action-btn delete"
              onclick="deleteStudent(${student.id})">
              Delete
            </button>
          </td>
        `;

        table.appendChild(row);

      });

      updateStats();
    }

    function updateStats(){

      document.getElementById("totalStudents").innerText =
        students.length;

      document.getElementById("activeStudents").innerText =
        students.filter(s => s.status === "Active").length;

      document.getElementById("inactiveStudents").innerText =
        students.filter(s => s.status === "Inactive").length;
    }

    function openModal(){
      document.getElementById("studentModal").style.display = "flex";
    }

    function closeModal(){

      document.getElementById("studentModal").style.display = "none";

      document.getElementById("studentForm").reset();

      editId = null;
    }

    document.getElementById("studentForm")
      .addEventListener("submit", function(e){

      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const className = document.getElementById("className").value;
      const status = document.getElementById("status").value;

      if(editId){

        students = students.map(student => {

          if(student.id === editId){
            return {
              ...student,
              name,
              email,
              className,
              status
            };
          }

          return student;
        });

      }else{

        const newStudent = {
          id: students.length
            ? students[students.length - 1].id + 1
            : 1,
          name,
          email,
          className,
          status
        };

        students.push(newStudent);
      }

      renderStudents();
      closeModal();
    });

    function deleteStudent(id){

      if(confirm("Delete this student?")){

        students = students.filter(student => student.id !== id);

        renderStudents();
      }
    }

    function editStudent(id){

      const student = students.find(s => s.id === id);

      if(!student) return;

      editId = id;

      document.getElementById("name").value = student.name;
      document.getElementById("email").value = student.email;
      document.getElementById("className").value = student.className;
      document.getElementById("status").value = student.status;

      openModal();
    }

    function searchStudent(){

      const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

      const filtered = students.filter(student =>
        student.name.toLowerCase().includes(keyword) ||
        student.email.toLowerCase().includes(keyword) ||
        student.className.toLowerCase().includes(keyword)
      );

      renderStudents(filtered);
    }

    renderStudents();

  </script>

</body>
</html>
